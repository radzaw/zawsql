name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ZawSQL.slnx -c Release
      - name: Unit tests (integration tests skip without a database)
        run: dotnet test ZawSQL.slnx -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.os }}
          path: TestResults

  js:
    name: UI unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run node:test suites
        working-directory: tests/js
        run: npm test

  package:
    name: Package (${{ matrix.rid }})
    needs: [build, js]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file build
        # A vX.Y.Z tag stamps the build with that version (what the self-updater compares).
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          sh ./publish.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: zawsql-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}

  sign:
    # Signs ZawSQL.exe with Azure Artifact Signing (formerly Trusted Signing) before the release is assembled,
    # so SHA256SUMS covers the signed file. Without the AZURE_SIGNING_* variables the release goes out unsigned.
    name: Sign Windows build
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zawsql-win-x64
          path: dist/win-x64
      - name: Signing not configured
        if: vars.AZURE_SIGNING_ACCOUNT == ''
        run: echo "::warning::AZURE_SIGNING_ACCOUNT is not set; the Windows build is released unsigned."
      - uses: azure/login@v3
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@v2
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ZawSQL
          description-url: ${{ github.server_url }}/${{ github.repository }}
      - name: Check the signature and that the signed build starts
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $exe = 'dist/win-x64/ZawSQL.exe'
          $sig = Get-AuthenticodeSignature $exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "ZawSQL.exe is not validly signed: $($sig.StatusMessage)" }
          $p = Start-Process $exe -PassThru -ArgumentList '--no-browser', '--port', '5399', '--token', 'smoke-token-0123456789abcdef', '--config', "$env:RUNNER_TEMP\zawsql-cfg"
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest http://127.0.0.1:5399/ -UseBasicParsing).StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          Stop-Process $p -Force
          if (-not $up) { throw 'The signed ZawSQL.exe did not start.' }
      - uses: actions/upload-artifact@v4
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        with:
          name: zawsql-win-x64
          path: dist/win-x64
          overwrite: true

  release:
    name: GitHub release
    needs: [package, sign]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zawsql-*
          path: artifacts
      - name: Name the assets the way the self-updater expects
        # zawsql-<rid>[.exe] plus SHA256SUMS; ZawSQL refuses a download whose checksum doesn't match.
        run: |
          mkdir release
          for d in artifacts/zawsql-*; do
            rid="${d#artifacts/zawsql-}"
            if [ -f "$d/ZawSQL.exe" ]; then cp "$d/ZawSQL.exe" "release/zawsql-$rid.exe"
            else cp "$d/ZawSQL" "release/zawsql-$rid"; chmod +x "release/zawsql-$rid"; fi
          done
          (cd release && sha256sum zawsql-* > SHA256SUMS && cat SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "ZawSQL ${GITHUB_REF_NAME#v}" --generate-notes $flags
