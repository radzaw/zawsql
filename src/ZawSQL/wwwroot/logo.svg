<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ZawSQL: a database carrying the Z of ZawCloud, on the ZawCloud tile (cyan → blue → violet, dark glass card).
       For 32 px and smaller, use zawsql-small.svg (no card, larger shapes). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="z" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#09090b" fill-opacity=".25" stroke="#fff" stroke-opacity=".2" stroke-width="8"/>
  <!-- database -->
  <path d="M104 140V372A152 46 0 0 0 408 372V140" fill="url(#body)"/>
  <ellipse cx="256" cy="140" rx="152" ry="46" fill="url(#top)" stroke="#fff" stroke-width="10"/>
  <!-- Z -->
  <path d="M170 214H342V256L230.9 344H342V386H170V344L281.1 256H170Z" fill="url(#z)"/>
</svg>
